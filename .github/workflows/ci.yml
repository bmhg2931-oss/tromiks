name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # נדרשים כדי ש-`next build` יצליח לבנות את הדפים הסטטיים (login/reset-password/
      # pending-approval) שיוצרים לקוח Supabase בזמן build - יש להגדיר אותם תחת
      # Settings -> Secrets and variables -> Actions באותם ערכים שכבר קיימים ב-Vercel
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
